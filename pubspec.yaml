name: talk_with_anyone_app
description: "Mobile client for Talk With Anyone - local-first voice chat."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  record: ^7.1.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  path_provider: ^2.1.6
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
